meta:
  version: 3
  flow: Classic
  substituting_steps:
    # Disable some signoff checks for this preliminary fast run
    Magic.DRC: null
    Checker.MagicDRC: null
    KLayout.XOR: null
    Netgen.LVS: null
    Checker.LVS: null

# ----------------------------------------------------
# 1. Design & Source Files
# ----------------------------------------------------
DESIGN_NAME: spi_opentarget_i3c_top
VERILOG_FILES:
  - dir::../src/spi_opentarget_i3c_top.sv
  - dir::../src/spi_apb_bridge.sv
  - dir::../src/opentarget_i3c_top.sv
  - dir::../src/i3c_apb_regs.sv
  - dir::../src/i3c_bus_det.sv
  - dir::../src/i3c_ccc_decoder.sv
  - dir::../src/i3c_ibi_hj_ctrl.sv
  - dir::../src/i3c_protocol_fsm.sv
  - dir::../src/i3c_fifo_cdc.sv
  - dir::../src/i3c_phy_frontend.sv

# ----------------------------------------------------
# 2. Clocking (Includes both async clocks)
# ----------------------------------------------------
CLOCK_PORT: "clk_i host_clk_i"
CLOCK_PERIOD: 20.0

PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc

# ----------------------------------------------------
# 3. Floorplan Constraints (Sized for the Chipathon Slot)
# ----------------------------------------------------
FP_SIZING: absolute
DIE_AREA: [0, 0, 450, 450]
CORE_AREA: [10, 10, 440, 440]
FP_PIN_ORDER_CFG: dir::pin_order.cfg

PL_TARGET_DENSITY_PCT: 55
GRT_ALLOW_CONGESTION: true

# ----------------------------------------------------
# 4. Power & Ground
# ----------------------------------------------------
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

# Disable the top-level core ring since this is a macro
PDN_CORE_RING: False
